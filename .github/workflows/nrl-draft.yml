name: NRL Draft
on:
  schedule:
    - cron: '0 22 * * 2'   # Wed 08:00 AEST
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Write,Edit,Bash,WebSearch,WebFetch" --permission-mode acceptEdits'
          prompt: |
            Run the NRL cycle for the upcoming round. Work autonomously to completion.
            1. Read CLAUDE.md, PUNTERS-DEN-BRIEF.md and config.json.
            2. Follow agents/scout.md, agents/gatekeeper.md, agents/analyst.md in order,
               writing scout_board.json, verified_board.json, slate_draft.json.
            3. Run: node validators/validate-slate.js slate_draft.json config.json
               If it fails, fix slate_draft.json and re-run until it PASSES.
            4. Write a short plain-English summary of the tips to PR_BODY.md.
            Do NOT commit, push, branch, or open a PR yourself — the workflow does that.
      - name: Open PR with the draft
        uses: peter-evans/create-pull-request@v6
        with:
          branch: slate/nrl-auto
          title: "slate: NRL draft"
          body-path: PR_BODY.md
          add-paths: |
            slate_draft.json
            scout_board.json
            verified_board.json
            PR_BODY.md
