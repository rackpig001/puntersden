name: NRL Draft
on:
  schedule:
    - cron: '0 22 * * 2'   # Wed 08:00 AEST
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Write,Edit,Bash,WebSearch,WebFetch" --permission-mode acceptEdits'
          prompt: |
            Run the NRL cycle for the upcoming round. Work autonomously to completion.
            1. Read CLAUDE.md, PUNTERS-DEN-BRIEF.md and config.json.
            2. Follow agents/scout.md, agents/gatekeeper.md, agents/analyst.md in order,
               writing scout_board.json, verified_board.json, slate_draft.json.
            3. Run: node validators/validate-slate.js slate_draft.json config.json
               Fix and re-run until it PASSES.
            4. FINALLY, print the full contents of slate_draft.json to the terminal by
               running:  cat slate_draft.json
               Then print a plain-English summary of the tips. This log output is the
               deliverable — make sure the full slate JSON is visible in the output.
