# Netlify configuration for The Punters Den
# Functions live in netlify/functions and run server-side (Stripe + member access).

[build]
  publish = "."
  functions = "netlify/functions"

# Bundle the data files with the functions that read them at runtime.
# One global list so EVERY function has them — the files are tiny, and this avoids
# the per-function override gotcha (a function-specific included_files list can
# replace this one instead of adding to it, which is what was hiding comp-history.json).
[functions]
  included_files = [
    "netlify/functions/tips.json",
    "netlify/functions/comp.json",
    "netlify/functions/comp-history.json"
  ]

# Always revalidate the Scoreboard data file so a fresh commit shows immediately
# instead of the browser/CDN serving a stale cached copy.
[[headers]]
  for = "/track-record.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pretty URL for the members tips page: /tips → tips.html
[[redirects]]
  from = "/tips"
  to = "/tips.html"
  status = 200

# Pretty URL for the post-payment welcome page: /checkout-complete → checkout-complete.html
[[redirects]]
  from = "/checkout-complete"
  to = "/checkout-complete.html"
  status = 200

# Pretty URL for the "get my tips by phone" recovery page: /find → find.html
[[redirects]]
  from = "/find"
  to = "/find.html"
  status = 200
