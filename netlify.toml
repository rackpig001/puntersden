# Netlify configuration for The Punters Den
# Functions live in netlify/functions and run server-side (Stripe + member access).

[build]
  publish = "."
  functions = "netlify/functions"

# Make sure data files are bundled with the functions that read them.
# Without this, the functions can't read the file at runtime.
[functions]
  included_files = ["netlify/functions/tips.json", "netlify/functions/comp.json"]

[functions."get-tips"]
  included_files = ["netlify/functions/tips.json"]

# The tipping comp functions read comp.json — bundle it with them too.
[functions."get-comp"]
  included_files = ["netlify/functions/comp.json"]

[functions."save-pick"]
  included_files = ["netlify/functions/comp.json"]

# Pretty URL for the members tips page: /tips → tips.html
[[redirects]]
  from = "/tips"
  to = "/tips.html"
  status = 200

# Pretty URL for the post-payment welcome page: /checkout-complete → checkout-complete.html
[[redirects]]
  from = "/checkout-complete"
  to = "/checkout-complete.html"
  status = 200

# Pretty URL for the "get my tips by phone" recovery page: /find → find.html
[[redirects]]
  from = "/find"
  to = "/find.html"
  status = 200

# Function endpoints (called by the site + Stripe). These are automatic,
# but listed here for clarity:
#   /.netlify/functions/create-checkout-session   → starts embedded checkout
#   /.netlify/functions/stripe-webhook            → Stripe calls this on payment/cancel
#   /.netlify/functions/get-tips                  → members page fetches their tips
