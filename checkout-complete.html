<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to The Punters Den 🐕</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, follow">
<meta name="description" content="Welcome to The Punters Den — your private tips link and what happens next.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Punters Den">
<meta property="og:title" content="Welcome to The Punters Den 🐕">
<meta property="og:description" content="Welcome to The Punters Den — your private tips link and what happens next.">
<meta property="og:url" content="https://thepuntersden.com/checkout-complete.html">
<meta property="og:image" content="https://thepuntersden.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Welcome to The Punters Den 🐕">
<meta name="twitter:description" content="Welcome to The Punters Den — your private tips link and what happens next.">
<meta name="twitter:image" content="https://thepuntersden.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a140f; --panel:#10201a; --panel-2:#13261d; --gold:#f5c542; --green:#2fd27a; --loss:#e6584e; --text:#f4f4f6; --muted:#9aa69c; --line:rgba(255,255,255,0.08); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--text); font-family:'Archivo',sans-serif; line-height:1.6; min-height:100vh; }
  nav { border-bottom:1px solid var(--line); background:rgba(10,10,12,0.72); backdrop-filter:blur(14px); }
  .nav-inner { display:flex; align-items:center; height:68px; max-width:760px; margin:0 auto; padding:0 22px; }
  .logo { display:flex; align-items:center; gap:10px; font-family:'Anton'; font-size:20px; letter-spacing:1px; text-transform:uppercase; text-decoration:none; color:inherit; }
  .logo .paw { font-size:24px; }
  .logo img.paw{height:30px;width:auto;vertical-align:middle;}
  .logo .den { color:var(--gold); }
  .wrap { max-width:680px; margin:0 auto; padding:44px 22px 80px; }
  .hero { text-align:center; padding:30px 10px 24px; }
  .pup { font-size:64px; display:inline-block; animation:bounce 1.6s ease-in-out infinite; }
  .pup-img { width:150px; height:auto; display:inline-block; margin-bottom:6px; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .kick { font-family:'Anton'; color:var(--gold); letter-spacing:1px; text-transform:uppercase; font-size:13px; margin-top:8px; }
  h1 { font-family:'Anton'; font-size:44px; letter-spacing:1px; margin:10px 0 6px; line-height:1.1; }
  .lead { color:var(--muted); font-size:16px; max-width:520px; margin:0 auto; }
  .tier-pill { display:inline-block; background:var(--panel); border:1px solid var(--gold); border-radius:50px; padding:6px 18px; font-size:13px; color:var(--gold); font-family:'Anton'; letter-spacing:1px; text-transform:uppercase; margin-top:14px; }
  .card { background:linear-gradient(165deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:16px; padding:26px; margin-top:24px; position:relative; }
  .card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),#ffe08a); border-radius:16px 16px 0 0; }
  .card h2 { font-family:'Anton'; font-size:22px; letter-spacing:1px; margin-bottom:10px; }
  .card p { color:var(--muted); font-size:15px; }
  .cta { display:block; background:var(--gold); color:#0a140f; text-align:center; padding:18px 24px; border-radius:12px; font-family:'Anton'; font-size:22px; letter-spacing:1px; text-decoration:none; margin-top:20px; transition:transform 0.15s; }
  .cta:hover { transform:translateY(-2px); }
  .cta-sub { text-align:center; color:var(--muted); font-size:13px; margin-top:10px; }
  .link-box { background:rgba(0,0,0,0.3); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-top:14px; font-family:monospace; font-size:12px; color:var(--muted); word-break:break-all; overflow-wrap:anywhere; }
  .copy-btn { display:inline-block; margin-top:10px; background:transparent; border:1px solid var(--line); color:var(--text); padding:8px 14px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
  .copy-btn:hover { border-color:var(--gold); color:var(--gold); }
  .copy-btn.copied { border-color:var(--green); color:var(--green); }
  .next { display:grid; gap:12px; margin-top:20px; }
  .next-item { display:flex; gap:14px; align-items:flex-start; padding:14px; background:rgba(0,0,0,0.2); border:1px solid var(--line); border-radius:10px; }
  .next-item .num { font-family:'Anton'; color:var(--gold); font-size:22px; flex-shrink:0; min-width:24px; }
  .next-item .t { color:var(--text); font-weight:600; }
  .next-item .d { color:var(--muted); font-size:13px; margin-top:2px; }
  .handle-row { display:flex; gap:8px; margin-top:14px; }
  .handle-row input { flex:1; min-width:0; background:rgba(0,0,0,0.3); border:1px solid var(--line); border-radius:9px; padding:12px 13px; color:var(--text); font-family:'Archivo'; font-size:15px; }
  .handle-row input:focus { outline:none; border-color:var(--gold); }
  .hsave { flex:0 0 auto; background:var(--gold); color:#1a1400; border:none; border-radius:9px; padding:0 18px; font-family:'Archivo'; font-weight:800; font-size:14px; cursor:pointer; }
  .handle-msg { font-size:13px; color:var(--muted); margin-top:9px; }
  .handle-done { font-size:15px; margin-top:14px; } .handle-done b { color:var(--gold); }
  .pending { text-align:center; padding:30px; }
  .spinner { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .rg { text-align:center; color:var(--muted); font-size:12px; margin-top:40px; padding-top:24px; border-top:1px solid var(--line); }
  @media (max-width:540px){ h1{font-size:32px;} .pup{font-size:50px;} .logo{font-size:18px;} .cta{font-size:18px;} }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo"><img src="logo.png" alt="The Punters Den" class="paw"> The Punters <span class="den">Den</span></a>
  </div>
</nav>

<div class="wrap">
  <div id="content">
    <div class="pending">
      <div class="spinner"></div>
      <p style="color:var(--muted);">Setting up your account…</p>
    </div>
  </div>

  <div class="rg">⚠️ Gamble responsibly. 18+ only. For entertainment purposes only. Gambling Help: 1800 858 858</div>
</div>

<script>
function copyLink() {
  const link = document.getElementById('linkBox')?.innerText;
  const btn = document.getElementById('copyBtn');
  if (!link || !btn) return;
  navigator.clipboard.writeText(link).then(() => {
    btn.innerText = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerText = 'Copy link'; btn.classList.remove('copied'); }, 1800);
  }).catch(() => { btn.innerText = 'Press & hold the link above to copy'; });
}

(async function () {
  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');

  function renderWelcome(tier, tipsUrl) {
    const tierName = (tier || 'member').charAt(0).toUpperCase() + (tier || 'member').slice(1);

    content.innerHTML = `
      <div class="hero">
        <img src="logo.png" alt="The Punters Den" class="pup-img">
        <div class="kick">You're in</div>
        <h1>Welcome to<br>The Punters Den</h1>
        <p class="lead">Your free week starts now. Card on file — no charge for 7 days. Cancel anytime in the trial and you won't pay a cent.</p>
        <div class="tier-pill">${tierName} member</div>
      </div>

      <div class="card">
        <h2>Your private tips link 🔗</h2>
        <p>This is your personal link to this week's tips. Bookmark it — keep it to yourself.</p>
        <a href="${tipsUrl}" class="cta">View My Tips →</a>
        <div class="cta-sub">Tap above to see your tips now</div>
        <div class="link-box" id="linkBox">${tipsUrl}</div>
        <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy link</button>
        <p style="font-size:14px; color:var(--muted); margin-top:16px; line-height:1.5;">Lost your link? No stress — jump back on <a href="/find" style="color:var(--gold); text-decoration:none; font-weight:600;">thepuntersden.com/find</a> and enter your mobile number to get it back anytime.</p>
      </div>

      <div class="card">
        <h2>🏆 Get on the Den Leaderboard</h2>
        <p>Pick a name to show on our public leaderboard — then climb it by bringing your mates to the Den.</p>
        <div class="handle-row"><input id="handleInput" maxlength="20" placeholder="Your leaderboard name" autocomplete="off"></div>
        <div class="handle-row" style="margin-top:8px;"><input id="handleConfirm" maxlength="20" placeholder="Type it again to confirm" autocomplete="off"><button id="handleSave" class="hsave" type="button">Save</button></div>
        <div class="handle-msg" id="handleMsg">⚠️ Choose carefully — your name is permanent and can't be changed once saved. (Optional — you can also do this later from your tips page.)</div>
      </div>
    `;

    // Wire the username save. The member record exists now (the link resolved).
    const key = (tipsUrl.split('key=')[1] || '').split('&')[0];
    const input = document.getElementById('handleInput');
    const confirm = document.getElementById('handleConfirm');
    const save = document.getElementById('handleSave');
    const msg = document.getElementById('handleMsg');
    async function saveHandle() {
      const val = (input && input.value || '').trim();
      const val2 = (confirm && confirm.value || '').trim();
      if (!val) { if (msg) msg.textContent = 'Type a name first.'; return; }
      if (val !== val2) { if (msg) msg.textContent = "Names don't match — check both boxes and try again."; return; }
      if (save) { save.disabled = true; save.textContent = 'Saving…'; }
      try {
        const res = await fetch('/.netlify/functions/set-profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, handle: val }) });
        const d = await res.json();
        if (d.ok) {
          const safe = String(d.handle).replace(/[&<>"]/g, '');
          const card = save.closest('.card') || document;
          card.querySelectorAll('.handle-row').forEach(function (r) { r.remove(); });
          const done = document.createElement('div');
          done.className = 'handle-done';
          done.innerHTML = '✅ You\'re on the board as <b>' + safe + '</b> 🔒';
          if (msg) { msg.parentNode.insertBefore(done, msg); msg.textContent = 'Locked in — bring your mates to climb the leaderboard.'; }
        } else {
          if (msg) msg.textContent = d.error || 'Try another name.';
          if (save) { save.disabled = false; save.textContent = 'Save'; }
        }
      } catch (e) {
        if (msg) msg.textContent = 'Something went wrong — try again.';
        if (save) { save.disabled = false; save.textContent = 'Save'; }
      }
    }
    if (save) save.addEventListener('click', saveHandle);
    if (confirm) confirm.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveHandle(); });
  }

  function renderPending() {
    content.innerHTML = `
      <div class="hero" style="padding-bottom:0;">
        <img src="logo.png" alt="The Punters Den" class="pup-img">
        <div class="kick">Almost there</div>
        <h1>Setting things up…</h1>
        <p class="lead">Your payment went through — just sorting your tips access. This usually takes a few seconds.</p>
      </div>
      <div class="pending"><div class="spinner"></div></div>
    `;
  }

  function renderError(msg) {
    content.innerHTML = `
      <div class="hero">
        <img src="logo.png" alt="The Punters Den" class="pup-img">
        <h1>Hmm — something's off</h1>
        <p class="lead">${msg}</p>
        <a href="/" style="display:inline-block;margin-top:24px;color:var(--gold);">← Back to the site</a>
      </div>
    `;
  }

  if (!sessionId) {
    renderError("We couldn't find your checkout session. If you just paid, check your email for the confirmation — your access should be there shortly.");
    return;
  }

  // Poll for the member link (webhook may be a moment behind)
  let attempts = 0;
  const maxAttempts = 10;   // ~20 seconds total
  async function tryFetch() {
    attempts++;
    try {
      const res = await fetch('/.netlify/functions/get-member-link?session_id=' + encodeURIComponent(sessionId));
      const data = await res.json();

      if (res.status === 200 && data.tipsUrl) {
        renderWelcome(data.tier, data.tipsUrl);
        return;
      }
      if (res.status === 202) {
        // pending — retry
        renderPending();
        if (attempts < maxAttempts) setTimeout(tryFetch, 2000);
        else renderError("It's taking longer than usual to set up your account. Check your email for the confirmation — or reload this page in a minute.");
        return;
      }
      renderError("We hit a snag setting up your access. Check your email for confirmation, or reload this page shortly.");
    } catch (err) {
      console.error(err);
      if (attempts < maxAttempts) setTimeout(tryFetch, 2000);
      else renderError("We couldn't reach our system to set up your access. Please reload the page or check your email.");
    }
  }

  renderPending();
  tryFetch();
})();
</script>

</body>
</html>
